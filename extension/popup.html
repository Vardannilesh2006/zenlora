<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #e11d2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
    }
    .status-pill {
      font-size: 10px;
      background: #10b981;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      margin-left: auto;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      font-size: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .label {
      color: #94a3b8;
    }
    .val {
      font-weight: 600;
      color: #f1f5f9;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-green {
      background: #059669;
      color: #fff;
    }
    .btn-red {
      background: #e11d2e;
      color: #fff;
    }
    .footer {
      font-size: 11px;
      text-align: center;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">Z</div>
    <div>
      <div class="title">Zenlora Auto-Bridge</div>
      <div style="font-size: 11px; color: #94a3b8;">SmartBiz & Wukusy Sync</div>
    </div>
    <div class="status-pill">Connected</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Store:</span>
      <span class="val">zenlora.store</span>
    </div>
    <div class="row">
      <span class="label">WhatsApp Bot:</span>
      <span class="val">+91 97713 70945 (Live)</span>
    </div>
    <div class="row">
      <span class="label">Discount Policy:</span>
      <span class="val">15% Instant Razorpay UPI</span>
    </div>
    <div class="row">
      <span class="label">OFD Check:</span>
      <span class="val">Flipkart-Style Availability</span>
    </div>
  </div>

  <div style="font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #94a3b8;">QUICK ACTIONS:</div>
  <button id="btn-test-confirm" class="btn btn-primary">⚡ Send Order Confirmation (+91 9608837916)</button>
  <button id="btn-test-ofd" class="btn btn-green">🚚 Send Out For Delivery Check (+91 9608837916)</button>

  <div id="status-msg" style="font-size: 11px; text-align: center; min-height: 18px; color: #38bdf8;"></div>

  <div class="footer">Zenlora Zero-Manual Dropship Suite v1.0</div>
  <script src="popup.js"></script>
</body>
</html>
