<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Ethereal Luminous Silk Squircle Background -->
    <linearGradient id="zenBackdrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>

    <!-- Aesthetic Luxury Gradient for Primary Monogram: Rose Gold into Radiant Amber -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Warm Golden Hour Glow for Sparkle -->
    <linearGradient id="sparkleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Opal Border -->
    <linearGradient id="opalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth without dark blacks -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Luminous Luxury Squircle (No dark colors) -->
  <rect x="3" y="3" width="58" height="58" rx="18" fill="url(#zenBackdrop)" stroke="url(#opalBorder)" stroke-width="2.5" />

  <!-- Aesthetic Modern Stylized 'Z' with Fluid Geometric Ribbons -->
  <g filter="url(#softGlow)">
    <!-- Top Horizontal Bar -->
    <path d="M19 20 C19 18.5, 20.5 17.5, 22.5 17.5 H41 C43 17.5, 44 18.5, 43.5 20.2 L41.5 24 C41 25, 40 25.5, 38.5 25.5 H24 C21 25.5, 19 23, 19 20 Z" 
          fill="url(#monogramGrad)" />

    <!-- Dynamic Diagonal Stream -->
    <path d="M41 22.5 L24 41.5 C22.8 42.8, 24 45, 25.8 45 H42 C44 45, 45 46.2, 44.5 47.8 L43.5 49.5 C43 51, 41.5 51.5, 39.5 51.5 H21 C18.5 51.5, 17.2 48.8, 19 46.8 L36 27.8 C37.2 26.5, 36 24.3, 34.2 24.3 H22 C20 24.3, 19 23.5, 19.5 22.5 Z" 
          fill="url(#monogramGrad)" />
  </g>

  <!-- 4-Point Radiant Sparkle Star (✦) Top-Right (Aesthetic Luxury Touch) -->
  <path d="M45.5 10 C45.5 13.5, 47 15, 50.5 15 C47 15, 45.5 16.5, 45.5 20 C45.5 16.5, 44 15, 40.5 15 C44 15, 45.5 13.5, 45.5 10 Z" 
        fill="url(#sparkleGold)" />

  <!-- Tiny Accent Pearl Dot Bottom-Left -->
  <circle cx="16" cy="48" r="2.2" fill="#10B981" opacity="0.85" />
</svg>
