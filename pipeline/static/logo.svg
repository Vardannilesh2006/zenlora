<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="50%" stop-color="#12100E" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0E6" />
      <stop offset="35%" stop-color="#EEDBC5" />
      <stop offset="70%" stop-color="#D4B996" />
      <stop offset="100%" stop-color="#BA9971" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.25)" />
    </linearGradient>
  </defs>

  <!-- Emblem Squircle -->
  <rect x="6" y="8" width="44" height="44" rx="12" fill="url(#logoBg)" stroke="url(#rimStroke)" stroke-width="1.2" />
  
  <!-- Monogram Z -->
  <path d="M19 22 H37 L21 38 H37" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="3.4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <circle cx="37" cy="22" r="1.8" fill="url(#goldGradient)"/>

  <!-- Brand Wordmark Typography -->
  <text x="62" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" letter-spacing="3.5" fill="url(#textGrad)">ZENLORA</text>
  
  <!-- Subtle Luxury Studio Badge -->
  <rect x="180" y="21" width="48" height="17" rx="4" fill="#F4ECE1" stroke="#E2D4C3" stroke-width="0.8"/>
  <text x="188" y="32.5" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#8C7355">STUDIO</text>
</svg>
